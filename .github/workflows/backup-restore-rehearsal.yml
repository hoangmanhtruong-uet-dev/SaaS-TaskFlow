name: Staging backup-restore rehearsal

on:
  workflow_dispatch:
  schedule:
    - cron: "43 3 * * 1"

concurrency:
  group: staging-backup-restore-rehearsal
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  recovery-rehearsal:
    name: Synthetic workspace recovery
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    defaults:
      run:
        working-directory: ui-prototype
    env:
      APP_ENV: staging
      TASKFLOW_CONFIRM_BACKUP_REHEARSAL: STAGING_EPHEMERAL_ONLY
      SUPABASE_STAGING_PROJECT_REF: ${{ vars.SUPABASE_STAGING_PROJECT_REF }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: ui-prototype/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run isolated recovery rehearsal
        run: npm run test:recovery:staging
