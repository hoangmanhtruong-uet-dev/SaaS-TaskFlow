name: Frontend CI

on:
  push:
    branches:
      - main
      - ui-prototype
  pull_request:

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Typecheck, lint, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Test and production build
        run: npm test

      - name: Verify database migrations and seed
        run: npm run test:db

      - name: Verify tenant isolation and role matrix
        run: npm run test:security

      - name: Verify production architecture and environment contract
        run: npm run env:check && npm run test:architecture

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run production-critical browser smoke tests
        run: npm run test:e2e
