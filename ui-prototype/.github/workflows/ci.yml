name: Frontend CI

on:
  push:
    branches:
      - main
      - ui-prototype
  pull_request:

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Typecheck, lint, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          # Secret scanning must include the complete reachable history.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Scan committed history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Test and production build
        run: npm test

      - name: Verify database migrations and seed
        run: npm run test:db

      - name: Reject unsafe contract migrations
        run: npm run test:migrations

      - name: Verify tenant isolation and role matrix
        run: npm run test:security

      - name: Verify production architecture and environment contract
        run: npm run env:check && npm run test:architecture

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run production-critical browser smoke tests
        run: npm run test:e2e

  production-database-security:
    name: Verify production database security catalog
    # The audit needs a privileged database URL and must never run against PRs.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Audit production Supabase RLS and grants
        run: npm run test:security:database
